<!DOCTYPE html>
<html><head><style>
html, body { margin: 0; padding: 0; width: 720pt; height: 405pt; overflow: hidden; }
body { font-family: Arial, sans-serif; display: flex; background: #FFFFFF; }
.sidebar { width: 10pt; background: #1565C0; height: 100%; }
.content { padding: 25pt 30pt; flex: 1; }
h1 { color: #0D47A1; font-size: 24pt; font-weight: bold; margin: 0 0 4pt 0; }
.divider { width: 40pt; height: 2pt; background: #42A5F5; margin-bottom: 14pt; }
.mod-grid { display: flex; flex-wrap: wrap; gap: 8pt; }
.mod-card { background: #F5F8FF; border-radius: 5pt; padding: 10pt 12pt; width: 28%; text-align: center; }
.mod-card.p { border-top: 3pt solid #E65100; }
.mod-card.s { border-top: 3pt solid #1565C0; }
.mod-name { color: #0D47A1; font-size: 14pt; font-weight: bold; margin: 0 0 2pt 0; }
.mod-size { color: #E65100; font-size: 18pt; font-weight: bold; margin: 0; }
.mod-unit { color: #888; font-size: 9pt; margin: 0; }
.mod-type { color: #555; font-size: 10pt; margin: 2pt 0 0 0; }
.ft-row { display: flex; gap: 10pt; margin-top: 10pt; }
.ft-card { flex: 1; background: #E3F2FD; border-radius: 4pt; padding: 8pt; text-align: center; }
.ft-title { color: #0D47A1; font-size: 11pt; font-weight: bold; margin: 0; }
.ft-desc { color: #555; font-size: 9pt; margin: 2pt 0 0 0; }
p { margin: 0; }
</style></head><body>
<div class="sidebar"></div>
<div class="content">
<h1>模型架构</h1>
<div class="divider"></div>
<div class="mod-grid">
  <div class="mod-card s"><p class="mod-name">SimpleCNN</p><p class="mod-size">1.2M</p><p class="mod-type">自定义4层卷积</p></div>
  <div class="mod-card s"><p class="mod-name">MobileNetV2</p><p class="mod-size">3.5M</p><p class="mod-type">深度可分离卷积</p></div>
  <div class="mod-card s"><p class="mod-name">ResNet18</p><p class="mod-size">11M</p><p class="mod-type">残差网络</p></div>
  <div class="mod-card s"><p class="mod-name">EfficientNetV2-S</p><p class="mod-size">21M</p><p class="mod-type">Fused-MBConv</p></div>
  <div class="mod-card s"><p class="mod-name">EfficientNetV2-M</p><p class="mod-size">53M</p><p class="mod-type">更深Fused-MBConv</p></div>
  <div class="mod-card p"><p class="mod-name">ConvNeXt Small</p><p class="mod-size">50M</p><p class="mod-type">🏆 最佳模型</p></div>
</div>
<div class="ft-row">
  <div class="ft-card"><p class="ft-title">全部迁移学习</p><p class="ft-desc">ImageNet 预训练权重</p></div>
  <div class="ft-card"><p class="ft-title">10 种架构</p><p class="ft-desc">1.2M ~ 53M 参数覆盖</p></div>
  <div class="ft-card"><p class="ft-title">分类头替换</p><p class="ft-desc">适配6类垃圾分类</p></div>
</div>
</div>
</body></html>

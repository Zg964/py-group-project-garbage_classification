<!DOCTYPE html>
<html><head><style>
html, body { margin: 0; padding: 0; width: 720pt; height: 405pt; overflow: hidden; }
body { font-family: Arial, sans-serif; display: flex; background: #FFFFFF; }
.sidebar { width: 10pt; background: #1565C0; height: 100%; }
.content { padding: 25pt 30pt; flex: 1; }
h1 { color: #0D47A1; font-size: 24pt; font-weight: bold; margin: 0 0 4pt 0; }
.divider { width: 40pt; height: 2pt; background: #42A5F5; margin-bottom: 14pt; }
.aug-grid { display: flex; flex-wrap: wrap; gap: 8pt; }
.aug-card { background: #F5F8FF; border-left: 3pt solid #1565C0; border-radius: 3pt; padding: 8pt 12pt; width: 45%; }
.aug-title { color: #0D47A1; font-size: 12pt; font-weight: bold; margin: 0 0 2pt 0; }
.aug-desc { color: #555; font-size: 10pt; margin: 0; }
.tag-sm { display: inline-block; background: #E8F5E9; color: #2E7D32; padding: 1pt 5pt; border-radius: 2pt; font-size: 9pt; }
p { margin: 0; }
</style></head><body>
<div class="sidebar"></div>
<div class="content">
<h1>数据增强策略</h1>
<div class="divider"></div>
<div class="aug-grid">
  <div class="aug-card"><p class="aug-title">几何增强</p><p class="aug-desc">随机翻转 (p=0.5) · 旋转 (±30°) · 透视变换</p></div>
  <div class="aug-card"><p class="aug-title">色彩增强</p><p class="aug-desc">ColorJitter (亮度/对比度/饱和度/色相)</p></div>
  <div class="aug-card"><p class="aug-title">自动增强</p><p class="aug-desc"><span class="tag-sm">v1.03</span> RandAugment (2 ops, mag=9)</p></div>
  <div class="aug-card"><p class="aug-title">区域混合</p><p class="aug-desc"><span class="tag-sm">v1.04</span> CutMix (alpha=0.4, prob=0.5)</p></div>
  <div class="aug-card"><p class="aug-title">随机擦除</p><p class="aug-desc"><span class="tag-sm">v1.04</span> RandomErasing (prob=0.25)</p></div>
  <div class="aug-card"><p class="aug-title">类别平衡</p><p class="aug-desc"><span class="tag-sm">v1.06</span> WeightedRandomSampler</p></div>
</div>
</div>
</body></html>
